<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search-filter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="wrap">
        <label for="q"><h1>Find a place</h1></label>
        <input id="q" type="search" placeholder="Type to filter..." aria-label="Search places">
        <ul id="list">
            <li>Nairobi,kenya</li>
            <li>Zurich,Switzerland</li>
            <li>Auckland,new-zealand</li>
            <li>Havana,Cuba</li>
            <li>Canberra,Australia</li>
            <li>Rio-de-janeiro,Brazil</li>
        </ul>
        <p id="none" class="none ">No matches.</p>
    
    </main>
</body>
</html>
